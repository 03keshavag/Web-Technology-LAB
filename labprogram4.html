<!DOCTYPE html>
<html>
<head>
    <title>Registration</title>
    <style>
        body{
            background: lightblue;
            font-family: cursive;
            display:flex;
            align-items: center;
            justify-content: center;
            margin-top: 100px;
            /* margin-bottom: 200px; */
        }
        h1{
            color: darkblue;
            font-size: 30px;
            text-align: center;
            background-color: bisque;
            padding: 15px;
            border-radius: 15px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }
        table{
            margin: auto;
            background: white;
            padding: 20px;
            border: 2px solid rgb(189, 185, 185);
            border-radius: 12%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        td{
            padding: 8px;
            color: rgb(28, 134, 92);
            font-size: 20px;
        }
        input,select,textarea{
            background: rgba(242, 243, 244, 0.607);
            padding: 5px;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .enter{
            font-size: 16px;
            border: none;
            background-color: rgb(255, 45, 45);
            color: white;
            font-weight: bold;
            border-radius: 60px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            padding: 9px;
        }
        .enter:hover{
            background-color: rgb(8, 151, 65);
        }
        .div{
            background-color: whitesmoke;
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            margin-bottom: 100px;
        }
    </style>
</head>
<body>
   <div class="div">
    Name:Keshava G ||
    USN :1BI24CS101
     <h1>Registration Form</h1>
    <form>
        <table>
            <tr>
                <td>Name:</td>
                <td><input type="text"></td>
            </tr>
            <tr>
                <td>Email:</td>
                <td><input type="email"></td>
            </tr>
            <tr>
                <td>Password:</td>
                <td><input type="password"></td>
            </tr>
            <tr>
                <td>Gender:</td>
                <td>
                    <input type="radio" name="g">Male
                    <input type="radio" name="g">Female
                </td>
            </tr>
            <tr>
                <td>Course:</td>
                <td>
                    <select>
                        <option>BCA</option>
                        <option>B.Tech</option>
                        <option>MCA</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Skills:</td>
                <td>
                    <input type="checkbox">HTML
                    <input type="checkbox">CSS
                    <input type="checkbox">JS
                </td>
            </tr>
            <tr>
                <td>Address:</td>
                <td><textarea></textarea></td>
            </tr>
            <tr>
                <td colspan ="2" align="center">
                    <input type="submit" value="Register" class="enter">
                    <input type="reset" value="clear" class="enter">
                </td>
            </tr>
        </table>
    </form>
   </div>
</body>
</html>
